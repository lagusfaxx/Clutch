# Despliegue con Docker. Las migraciones corren solas al levantar la
# aplicación.
#
# Con Coolify (buildpack Docker Compose), usa este archivo tal cual: el
# contenedor NO publica puertos y Traefik lo alcanza por la red interna.
# Define el dominio del servicio `app` en el panel de Coolify.
#
# En un VPS pelado, sin panel ni proxy, hace falta publicar el puerto:
#
#   cp .env.example .env    # completa AUTH_SECRET, POSTGRES_PASSWORD, etc.
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clutch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:-clutch}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # Los respaldos de pg_dump caen acá. Va como volumen con nombre y no
      # como carpeta del proyecto porque el panel puede rehacer el directorio
      # de despliegue en cada redeploy y se llevaría los respaldos.
      # Súbelos a otra parte igual: un respaldo en el mismo servidor que la
      # base no es un respaldo.
      - respaldos:/respaldos
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clutch} -d ${POSTGRES_DB:-clutch}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Sin puertos publicados: la base solo se ve desde la red interna.

  app:
    build:
      context: .
      args:
        # El dominio tiene que estar presente al CONSTRUIR, no solo al
        # ejecutar: Next graba en la imagen desde qué orígenes acepta envíos
        # de formulario. Si no calza, cada formulario del sitio falla con
        # "Invalid Server Actions request".
        #
        # Acá va una sola variable, y la que ya existe. Declarar una segunda
        # solo para esto hace que el panel la registre como variable propia,
        # y si queda guardada con un valor a medias ningún cambio en este
        # archivo la corrige: hay que borrarla a mano en el panel.
        SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Esta primera clave no es una variable más: es la señal que Coolify
      # busca para saber que este servicio se publica en el puerto 3000, y
      # con eso genera las etiquetas de Traefik. Va SIN valor a propósito.
      # Escribirla como `CLAVE: algo` la convierte en una variable corriente
      # y el proxy se queda sin ruta, que es el 404 de "page not found".
      #
      # Y va en un bloque de mapa, no de lista: Coolify vuelve a escribir
      # este archivo antes de construir, y una entrada suelta de lista (sin
      # `=`) la reescribe con la posición como clave, lo que revienta el
      # despliegue con "non-string key in services.app.environment: 0".
      SERVICE_FQDN_APP_3000:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clutch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clutch}
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET en el .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      FORTNITE_API_KEY: ${FORTNITE_API_KEY:-}
      FORTNITE_API_IO_KEY: ${FORTNITE_API_IO_KEY:-}
      PRIZE_ENCRYPTION_KEY: ${PRIZE_ENCRYPTION_KEY:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CANAL_TORNEOS: ${DISCORD_CANAL_TORNEOS:-}
      TBK_COMMERCE_CODE: ${TBK_COMMERCE_CODE:-}
      TBK_API_KEY: ${TBK_API_KEY:-}
      TBK_AMBIENTE: ${TBK_AMBIENTE:-integracion}
      # Una sola instancia corre la cola y el bot. Si algún día escalas a
      # varias, esto va en true en una sola.
      RUN_BACKGROUND: 'true'
    # Sin `ports` a propósito.
    #
    # Detrás de un proxy (Traefik en Coolify, o nginx propio), publicar el
    # puerto en el host no aporta nada y además choca: si algo más ya ocupa
    # el 3000, el despliegue muere con "port is already allocated".
    # Para un VPS sin proxy, docker-compose.vps.yml agrega la publicación.
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  datos_postgres:
  respaldos:
